<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">AIHP commercial building</title>
  <desc id="desc">Stylized modern office building used when a site photograph is not available.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12394a"/>
      <stop offset="0.58" stop-color="#0a2635"/>
      <stop offset="1" stop-color="#061923"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#75b6c4" stop-opacity="0.78"/>
      <stop offset="0.45" stop-color="#1b5264" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0a2937"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#183640"/>
      <stop offset="1" stop-color="#07141c"/>
    </linearGradient>
    <pattern id="windows" width="68" height="48" patternUnits="userSpaceOnUse">
      <rect width="50" height="30" x="9" y="8" rx="3" fill="#b7e4ea" fill-opacity="0.42"/>
      <rect width="50" height="3" x="9" y="35" fill="#051622" fill-opacity="0.75"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="640" fill="url(#sky)"/>
  <circle cx="1030" cy="95" r="155" fill="#128aa0" fill-opacity="0.16"/>
  <circle cx="155" cy="105" r="110" fill="#8b1212" fill-opacity="0.2"/>
  <path d="M0 432C190 400 312 428 480 412c228-22 413-5 720 27v201H0Z" fill="url(#ground)"/>
  <g filter="url(#shadow)">
    <path d="M250 115h330v385H250z" fill="url(#glass)" stroke="#8fc8d1" stroke-opacity="0.25" stroke-width="4"/>
    <path d="M580 170h370v330H580z" fill="#0b3443" stroke="#8fc8d1" stroke-opacity="0.2" stroke-width="4"/>
    <path d="M280 145h270v325H280z" fill="url(#windows)"/>
    <path d="M612 205h305v265H612z" fill="url(#windows)" opacity="0.85"/>
    <path d="M220 500h780v32H220z" fill="#8b1212"/>
    <path d="M490 395h190v105H490z" fill="#071923" stroke="#dceff1" stroke-opacity="0.22" stroke-width="3"/>
    <path d="M518 420h134v80H518z" fill="#dceff1" fill-opacity="0.18"/>
    <path d="M250 115h330l-38-35H286z" fill="#dceff1" fill-opacity="0.2"/>
  </g>
  <g fill="#7bb4a2">
    <circle cx="190" cy="487" r="45"/><rect x="183" y="487" width="14" height="63" fill="#614333"/>
    <circle cx="1030" cy="490" r="52"/><rect x="1022" y="490" width="16" height="66" fill="#614333"/>
  </g>
  <path d="M90 563h1020" stroke="#cfe8e9" stroke-opacity="0.28" stroke-width="5" stroke-linecap="round"/>
</svg>
